name: Lint

on:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --target-branch=main --validate-maintainers=false
      - name: Lint Helm Chart
        run: |
          helm lint ./charts/*

      - name: Verify Helm CRDs
        run: make verify-helm-crds
      - name: Verify Helm RBAC
        run: make verify-helm-roles
      - name: Verify Helm docs
        run: make verify-helm-docs
