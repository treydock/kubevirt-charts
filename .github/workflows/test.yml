name: Test Charts

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          cluster_name: kind

      - name: Install CRDs
        run: |
          helm install kubevirt-crd charts/kubevirt-crd -n kubevirt --create-namespace --wait --timeout 300s
          helm install cdi-crd charts/cdi-crd -n cdi --create-namespace --wait --timeout 300s

      - name: Run chart-testing kubevirt (install)
        run: ct install --target-branch=main --charts charts/kubevirt --namespace kubevirt --skip-clean-up
      - name: Run chart-testing cdi (install)
        run: ct install --target-branch=main --charts charts/cdi --namespace cdi --skip-clean-up

      - name: Debug failure
        if: failure()
        run: |
          kubectl describe kubevirt -n kubevirt
          kubectl describe cdi -n cdi
      - name: Get logs
        if: failure()
        run: |
          kubectl logs -n kubevirt -l name=virt-operator --tail=200
          kubectl logs -n cdi -l name=cdi-operator --tail=200
