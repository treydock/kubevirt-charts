{{- if .Values.uploadproxy.ingress.enable }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdi-uploadproxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cdi.labels" . | nindent 4 }}
    {{- with .Values.uploadproxy.ingress.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.uploadproxy.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.uploadproxy.ingress.className }}
  ingressClassName: {{ .Values.uploadproxy.ingress.className }}
  {{- end }}
  {{- with .Values.uploadproxy.ingress.tls }}
  tls:
    {{- tpl (toYaml . ) $ | nindent 4 }}
  {{- end }}
  rules:
  - host: {{ required "Ingress host is required" (tpl .Values.uploadproxy.ingress.host .) | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cdi-uploadproxy
            port:
              number: 443
{{- end }}
